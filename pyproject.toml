[project]
name = "hireline-recruiter"
version = "0.1.0"
description = "Explainable recruiting workflows for synthetic portfolio data"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
